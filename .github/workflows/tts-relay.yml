name: TTS narration relay
on:
  workflow_dispatch:
    inputs:
      seconds_per_line:
        description: '每幕时长（秒），与视频时间轴对齐'
        required: true
        default: '6'
      voice:
        description: 'Edge TTS 中文声音'
        required: true
        default: 'zh-CN-YunxiNeural'
      rate:
        description: '基础语速，例如 +0% / +8%'
        required: true
        default: '+0%'
jobs:
  synth:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install edge-tts
        run: pip install --quiet edge-tts

      - name: Synthesize one clip per line
        env:
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
        run: |
          set -e
          mkdir -p clips
          python - <<'PY'
          import asyncio, os
          import edge_tts
          lines = [l.strip() for l in open('tts-job/script.txt', encoding='utf-8') if l.strip()]
          voice = os.environ['VOICE']; rate = os.environ['RATE']
          print(f'{len(lines)} lines, voice={voice}, rate={rate}')
          async def main():
              for i, text in enumerate(lines, 1):
                  out = f'clips/{i:02d}.mp3'
                  await edge_tts.Communicate(text, voice, rate=rate).save(out)
                  print(f'  {out}: {text}')
          asyncio.run(main())
          PY

      - name: Publish the MP3 clips back into the repo
        run: |
          set -e
          git config user.name  "tts-relay-bot"
          git config user.email "tts-relay-bot@users.noreply.github.com"
          mkdir -p tts-output/clips
          cp clips/*.mp3 tts-output/clips/
          cp tts-job/script.txt tts-output/script.txt
          echo "== clips ==" && ls -lh tts-output/clips/
          git add -f tts-output/
          git commit -m "tts relay: 8 mp3 clips (${{ github.run_id }})" || echo "no changes"
          git push
